# Canonical project configuration for Codex CLI 0.144.4.
# Install as .codex/config.toml in a trusted clone; role paths are relative to it.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[agents]
# Enough for one focused implementation plus independent read-only checks.
max_threads = 3
# Root-only delegation: child agents cannot create their own subagents.
max_depth = 1
interrupt_message = true

[agents.repo_explorer]
description = "Read-only, targeted repository exploration and architecture mapping."
config_file = "agents/repo_explorer.toml"

[agents.design_director]
description = "Read-only visual direction and design critique for meaningful UI work."
config_file = "agents/design_director.toml"

[agents.implementation_agent]
description = "The sole editor for an explicitly assigned file area."
config_file = "agents/implementation_agent.toml"

[agents.browser_qa]
description = "Read-only browser QA with reproducible viewport and interaction evidence."
config_file = "agents/browser_qa.toml"

[agents.api_contract_agent]
description = "Read-only validation of existing API contracts and failure states."
config_file = "agents/api_contract_agent.toml"

[agents.accessibility_performance_reviewer]
description = "Read-only accessibility and performance review of scoped changes."
config_file = "agents/accessibility_performance_reviewer.toml"

[agents.independent_reviewer]
description = "Read-only independent review of a scoped diff and acceptance criteria."
config_file = "agents/independent_reviewer.toml"
